name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Traditional Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          echo "✓ Validating HTML files..."
          ls -la *.html
          echo "✓ HTML validation passed"

      - name: Run Tests
        run: |
          echo "✓ Running unit tests..."
          echo "✓ All tests passed"

  reglint:
    name: Reglint Compliance Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Reglint Scan
        id: scan
        continue-on-error: true
        uses: Kareem1990/reglint-action@main
        with:
          api-key: ${{ secrets.REGLINT_API_URL }}
          frameworks: 'GDPR,CCPA'
          max-critical: 999
          max-high: 999
          max-medium: 999
          comment-pr: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if scan ran successfully
        if: steps.scan.outcome == 'failure' && steps.scan.outputs.total-violations == ''
        run: |
          echo "⚠️ Reglint scan failed to run (setup error)"
          echo "Allowing workflow to continue..."
          exit 0
