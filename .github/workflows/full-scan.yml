name: Full Compliance Audit

# Manual trigger only - for deep compliance audits
on:
  workflow_dispatch:
    inputs:
      frameworks:
        description: 'Compliance frameworks to check (comma-separated)'
        required: false
        default: 'GDPR,CCPA,HIPAA'
        type: string
      severity:
        description: 'Scan severity level'
        required: false
        default: 'strict'
        type: choice
        options:
          - strict
          - balanced
          - monitoring

jobs:
  # Full Repository Compliance Scan
  reglint-full:
    name: Full Repository Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for full scan

      - name: Run Full Reglint Compliance Scan
        id: reglint
        uses: Kareem1990/reglint-action@main
        with:
          api-key: ${{ secrets.REGLINT_API_KEY }}
          frameworks: ${{ github.event.inputs.frameworks || 'GDPR,CCPA,HIPAA' }}
          # Strict mode: Zero tolerance for critical/high issues
          max-critical: ${{ github.event.inputs.severity == 'strict' && 0 || (github.event.inputs.severity == 'balanced' && 0 || 5) }}
          max-high: ${{ github.event.inputs.severity == 'strict' && 0 || (github.event.inputs.severity == 'balanced' && 3 || 10) }}
          max-medium: ${{ github.event.inputs.severity == 'strict' && 5 || (github.event.inputs.severity == 'balanced' && 10 || 20) }}
          max-low: 999
          comment-pr: false

      - name: Display Scan Summary
        if: always()
        run: |
          echo "## 📊 Compliance Scan Results"
          echo ""
          echo "**Total Violations:** ${{ steps.reglint.outputs.total-violations }}"
          echo "**Critical:** ${{ steps.reglint.outputs.critical-count }}"
          echo "**High:** ${{ steps.reglint.outputs.high-count }}"
          echo "**Medium:** ${{ steps.reglint.outputs.medium-count }}"
          echo "**Low:** ${{ steps.reglint.outputs.low-count }}"
          echo ""
          echo "**Status:** ${{ steps.reglint.outputs.passed == 'true' && '✅ PASSED' || '❌ FAILED' }}"

      - name: Generate Compliance Report
        if: always()
        run: |
          cat << EOF > compliance-report.md
          # 🔒 Full Compliance Audit Report
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Frameworks:** ${{ github.event.inputs.frameworks || 'GDPR,CCPA,HIPAA' }}
          **Severity Mode:** ${{ github.event.inputs.severity || 'strict' }}
          **Repository:** ${{ github.repository }}
          **Commit:** ${{ github.sha }}
          
          ---
          
          ## 📊 Violation Summary
          
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | ${{ steps.reglint.outputs.critical-count }} |
          | 🟠 High | ${{ steps.reglint.outputs.high-count }} |
          | 🟡 Medium | ${{ steps.reglint.outputs.medium-count }} |
          | 🟢 Low | ${{ steps.reglint.outputs.low-count }} |
          | **Total** | **${{ steps.reglint.outputs.total-violations }}** |
          
          ---
          
          ## ✅ Scan Status
          
          **Result:** ${{ steps.reglint.outputs.passed == 'true' && '✅ PASSED - Repository meets compliance thresholds' || '❌ FAILED - Compliance violations exceed thresholds' }}
          
          ---
          
          ## 📋 Next Steps
          
          ${{ steps.reglint.outputs.passed == 'true' && '- ✅ No action required - compliance standards met' || '- ❌ Review and fix violations above thresholds' }}
          ${{ steps.reglint.outputs.passed == 'true' && '- 📅 Schedule next audit' || '- 🔄 Re-run scan after fixes' }}
          ${{ steps.reglint.outputs.passed == 'true' && '- 📊 Monitor for new violations' || '- 📖 Review compliance documentation' }}
          
          ---
          
          *Generated by Reglint Compliance Scanner*
          EOF
          
          cat compliance-report.md

      - name: Upload Compliance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ github.run_number }}
          path: compliance-report.md
          retention-days: 90

      - name: Fail on Violations
        if: steps.reglint.outputs.passed != 'true'
        run: |
          echo "❌ Compliance scan failed - violations exceed thresholds"
          echo "Review the compliance report artifact for details"
          exit 1
