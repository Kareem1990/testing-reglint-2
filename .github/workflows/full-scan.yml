name: Full Compliance Scan

on:
  workflow_dispatch:

jobs:
  full-scan:
    name: Full Repository Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
Update the full scan workflow to not fail on violations (it's just a report):

Change:
  max-critical: 0
  max-high: 0

To:
  max-critical: 999
